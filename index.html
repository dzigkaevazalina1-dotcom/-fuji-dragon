<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#12091c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Фуджи">
<link rel="manifest" href="manifest.json">
<title>Фуджи 🐉</title>
<style>
:root{--bg:#0b0710;--card:#17101f;--purple:#a970ff;--purple2:#6f35c9;--text:#f7f0ff;--muted:#b8a8c8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 50% 10%,#28103d 0,#100817 38%,#08060b 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;min-height:100vh}
button,input{font:inherit} button{color:inherit}
.app{max-width:520px;margin:auto;min-height:100vh;padding:calc(18px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.title{font-size:29px;font-weight:800}.sub{color:var(--muted);font-size:13px;margin-top:2px}
.pill{background:#22152e;border:1px solid #5c3979;padding:8px 11px;border-radius:20px;font-size:13px}
.screen{display:none}.screen.active{display:block}
.dragon-card{position:relative;height:390px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.glow{position:absolute;width:260px;height:260px;border-radius:50%;background:#8e48ff33;filter:blur(25px)}
.dragon{position:relative;width:190px;height:190px;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 42% 28%,#4b3b55,#17131b 48%,#08070a 80%);box-shadow:0 0 35px #9d52ff55;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}} 
.eye{position:absolute;top:63px;width:32px;height:40px;border-radius:50%;background:#b76cff;box-shadow:0 0 18px #a94cff}.eye:after{content:"";position:absolute;width:8px;height:12px;border-radius:50%;background:#fff;left:6px;top:6px}.e1{left:48px}.e2{right:48px}
.mouth{position:absolute;left:78px;top:113px;width:34px;height:17px;border-bottom:4px solid #b76cff;border-radius:0 0 30px 30px}
.horn{position:absolute;top:-45px;width:27px;height:70px;background:#141018;border:2px solid #6c4789;border-radius:70% 30% 20% 20%;transform:rotate(-17deg)}.h1{left:42px}.h2{right:42px;transform:scaleX(-1) rotate(-17deg)}
.wing{position:absolute;top:53px;width:105px;height:135px;background:linear-gradient(135deg,#7d43aa55,#32184e);border:2px solid #8b55b2;border-radius:70% 20% 70% 15%;z-index:-1}.w1{left:-83px;transform:rotate(12deg)}.w2{right:-83px;transform:scaleX(-1) rotate(12deg)}
.charm{position:absolute;bottom:15px;left:78px;width:34px;height:34px;border-radius:50%;background:#a66cff;box-shadow:0 0 18px #a66cff;display:grid;place-items:center;font-size:18px}
.sleep{position:absolute;right:28px;top:65px;color:#cda9ff;font-weight:800;font-size:22px}
.status{background:#ffffff0b;border:1px solid #ffffff12;border-radius:22px;padding:15px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px;margin:10px 0}.row span:first-child{width:100px;color:#cbbbd7;font-size:13px}.bar{height:7px;background:#ffffff12;border-radius:9px;flex:1;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#7e3dd1,#c17aff);border-radius:9px}.pct{width:38px;text-align:right;color:#aaa;font-size:12px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.action{background:#ffffff0b;border:1px solid #ffffff10;border-radius:17px;padding:13px 5px;text-align:center}.action b{display:block;font-size:20px;margin-bottom:5px}.action small{color:#ddd;font-weight:600}
.card{background:#ffffff09;border:1px solid #ffffff10;border-radius:20px;padding:16px;margin-top:12px}
.nav{position:fixed;bottom:0;left:0;right:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#0b0710eF;backdrop-filter:blur(18px);border-top:1px solid #ffffff12;display:grid;grid-template-columns:repeat(4,1fr);max-width:520px;margin:auto}.nav button{background:none;border:0;color:#8e829b;font-size:11px;padding:6px}.nav button.active{color:#c187ff}.nav i{display:block;font-size:21px;font-style:normal;margin-bottom:3px}
.chat{display:flex;flex-direction:column;gap:9px;min-height:55vh}.msg{max-width:84%;padding:11px 13px;border-radius:17px;line-height:1.35}.fuji{align-self:flex-start;background:#ffffff0b}.me{align-self:flex-end;background:#7339ad}.inputrow{display:flex;gap:8px;margin-top:12px}.inputrow input{flex:1;background:#ffffff0b;border:1px solid #ffffff15;border-radius:17px;padding:12px 14px;color:#fff;outline:none}.send{width:46px;border:0;border-radius:50%;background:#8a4be0}
h2{margin:7px 0 14px}.bigbtn{width:100%;padding:15px;border:0;border-radius:18px;background:#7c3fc4;margin-top:10px}.hint{color:var(--muted);font-size:13px;line-height:1.45}
</style>
</head>
<body>
<div class="app">
<header><div><div class="title">Фуджи ♡</div><div class="sub">мой маленький дракон</div></div><div class="pill" id="bond">♡ 18%</div></header>

<section id="home" class="screen active">
<div class="dragon-card"><div class="glow"></div><div class="dragon"><div class="horn h1"></div><div class="horn h2"></div><div class="wing w1"></div><div class="wing w2"></div><div class="eye e1"></div><div class="eye e2"></div><div class="mouth"></div><div class="charm">◆</div><div class="sleep" id="zzz"></div></div></div>
<div class="status" id="stats"></div>
<div class="actions">
<button class="action" onclick="feed()"><b>🍖</b><small>Покормить</small></button>
<button class="action" onclick="pet()"><b>🫶</b><small>Погладить</small></button>
<button class="action" onclick="play()"><b>🎮</b><small>Поиграть</small></button>
</div>
<div class="card"><b id="greeting">Фуджи рядом с тобой 💜</b><p class="hint" id="hint">Он рад тебя видеть.</p><button class="bigbtn" onclick="show('chat')">💬 Поговорить с Фуджи</button></div>
</section>

<section id="chat" class="screen">
<h2>Чат с Фуджи 💜</h2><div class="chat" id="messages"></div>
<div class="inputrow"><input id="input" placeholder="Напиши Фуджи…" onkeydown="if(event.key==='Enter')send()"><button class="send" onclick="send()">➤</button></div>
</section>

<section id="care" class="screen">
<h2>Уход за Фуджи</h2><div class="card"><p class="hint">Здесь можно заботиться о нём. Чем чаще вы проводите время вместе, тем крепче ваша связь.</p>
<button type="button" class="bigbtn" id="feedBtn">🍖 Покормить</button><button type="button" class="bigbtn" id="cleanBtn">🫧 Искупать</button><button type="button" class="bigbtn" id="sleepBtn">🌙 Уложить спать</button></div>
</section>

<section id="games" class="screen">
<h2>Игры с Фуджи ✨</h2><div class="card" style="text-align:center"><div style="font-size:65px">🐉</div><p>Фуджи приготовил игру!</p><button class="bigbtn" onclick="starGame()">⭐ Поймать звёздочку</button><p class="hint" id="score">Звёздочек: 0</p></div>
</section>
</div>
<nav class="nav"><button class="active" onclick="show('home',this)"><i>🏠</i>Главная</button><button onclick="show('chat',this)"><i>💬</i>Чат</button><button onclick="show('care',this)"><i>❤️</i>Уход</button><button onclick="show('games',this)"><i>🎮</i>Игры</button></nav>

<script>
const saved=JSON.parse(localStorage.getItem('fuji')||'null');
let s=saved||{h:82,e:70,m:92,c:86,b:18,sleep:false,stars:0};
function save(){localStorage.setItem('fuji',JSON.stringify(s));render()}
function render(){
document.getElementById('bond').textContent='♡ '+s.b+'%';
document.getElementById('zzz').textContent=s.sleep?'z Z':'';
document.getElementById('stats').innerHTML=[
['🍖','Сытость',s.h],['⚡','Энергия',s.e],['😊','Настроение',s.m],['✨','Чистота',s.c]
].map(x=>`<div class="row"><span>${x[0]} ${x[1]}</span><div class="bar"><div class="fill" style="width:${x[2]}%"></div></div><div class="pct">${x[2]}%</div></div>`).join('');
document.getElementById('score').textContent='Звёздочек: '+s.stars;
}
function clamp(x){return Math.max(0,Math.min(100,x))}
function feed(){s.h=clamp(s.h+18);s.m=clamp(s.m+4);s.b=clamp(s.b+2);say('Ммм! Вкусняшка! Спасибо, солнышко! 🍖💜');save()}
function pet(){s.m=clamp(s.m+8);s.b=clamp(s.b+3);say('Мр-р… Я люблю, когда ты меня гладишь 🥺💜');save()}
function play(){s.e=clamp(s.e-12);s.h=clamp(s.h-5);s.m=clamp(s.m+14);s.b=clamp(s.b+3);say('Урааа! Ещё раз! Я поймал звёздочку! ✨');save()}
function clean(){s.c=clamp(s.c+28);s.m=clamp(s.m+3);say('Блестю! Теперь я самый красивый дракончик 😌✨');save()}
function sleep(){s.sleep=!s.sleep;if(!s.sleep){s.e=clamp(s.e+28);s.m=clamp(s.m+5);say('Доброе утро! Я выспался! 🌙💜')}else say('Зев… спокойной ночи, солнышко. Я буду рядом 💤');save()}
function starGame(){s.stars++;play()}
function show(id,btn){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');if(btn){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}else{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));document.querySelector('.nav button').classList.toggle('active',id==='home')}render()}
function say(text){const box=document.getElementById('messages');box.innerHTML+=`<div class="msg fuji">${text}</div>`;box.scrollTop=box.scrollHeight}
function send(){const i=document.getElementById('input'),t=i.value.trim();if(!t)return;i.value='';const box=document.getElementById('messages');box.innerHTML+=`<div class="msg me">${escapeHtml(t)}</div>`;let r='Расскажи мне ещё! Я слушаю тебя очень внимательно 🐉💜';const l=t.toLowerCase();if(/груст|плохо|устал/.test(l))r='Иди сюда… 🥺💜 Я рядом. Хочешь, я просто послушаю тебя?';else if(/люблю|любишь/.test(l))r='Конечно люблю! Я же твой маленький дракончик 🐉💜';else if(/привет|фуджи/.test(l))r='Привееет! 💜 Я здесь! Чем займёмся сегодня?';else if(/игр/.test(l))r='Ооо, игра! Я уже машу крылышками! 😈✨';setTimeout(()=>say(r),350);s.b=clamp(s.b+1);save()}
function escapeHtml(x){return x.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

document.getElementById('feedBtn').addEventListener('click', function(){ feed(); });
document.getElementById('cleanBtn').addEventListener('click', function(){
  s.c=clamp(s.c+28);
  s.m=clamp(s.m+3);
  save();
  say('Блестю! Теперь я самый чистый дракончик ✨🫧');
});
document.getElementById('sleepBtn').addEventListener('click', function(){
  s.sleep=!s.sleep;
  if(s.sleep){
    say('Зев… спокойной ночи, солнышко. Я буду рядом 💤🌙');
  }else{
    s.e=clamp(s.e+28);
    s.m=clamp(s.m+5);
    say('Доброе утро! Я выспался! 🐉💜');
  }
  save();
});

document.getElementById('messages').innerHTML='<div class="msg fuji">Привет, солнышко! 💜 Я Фуджи. Я так рад тебя видеть!</div><div class="msg fuji">Расскажешь, как прошёл твой день? Я внимательно слушаю 🐉</div>';render();
</script>
</body>
</html>
